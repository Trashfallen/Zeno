# Тег vX.Y.Z -> тесты, сборка Zeno.exe и релиз на GitHub с exe и архивом для тестеров.
# Установленные копии программы сами найдут релиз и предложат обновиться.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Версия в VERSION совпадает с тегом
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "VERSION = $v, тег = ${{ github.ref_name }}" }

      - name: Тесты
        run: go test ./...

      - name: Сборка
        shell: cmd
        run: build.cmd

      - name: Архив для тестеров
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/Zeno.exe release/
          Copy-Item docs/README-testers.txt release/README.txt
          Compress-Archive -Path release/* -DestinationPath dist/Zeno-${{ github.ref_name }}-win64.zip

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Zeno.exe
            dist/Zeno-${{ github.ref_name }}-win64.zip
          generate_release_notes: true
